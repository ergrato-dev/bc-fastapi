<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .bg       { fill: #1a1a2e; }
      .panel    { fill: #16213e; rx: 8; }
      .title    { fill: #ffffff; font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; }
      .heading  { fill: #ffffff; font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; }
      .label    { fill: #e0e0e0; font-family: 'Segoe UI', sans-serif; font-size: 13px; }
      .sublabel { fill: #9e9e9e; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
      .bad      { fill: #e53935; }
      .good     { fill: #009688; }
      .neutral  { fill: #546e7a; }
      .divider  { stroke: #37474f; stroke-width: 1; }
      .icon-bg-bad  { fill: #b71c1c; }
      .icon-bg-good { fill: #004d40; }
      .layer-bg { fill: #0f3460; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="420"/>

  <!-- Title -->
  <text class="title" x="400" y="38" text-anchor="middle">Docker vs Instalación Tradicional</text>

  <!-- Divider line center -->
  <line x1="400" y1="55" x2="400" y2="390" class="divider"/>

  <!-- === LEFT PANEL: Tradicional === -->
  <rect x="20" y="60" width="360" height="340" rx="8" fill="#16213e"/>
  <text class="heading" x="200" y="88" text-anchor="middle" fill="#ef5350">⚠ Instalación Tradicional</text>

  <!-- Problem row 1 -->
  <rect x="40" y="100" width="320" height="52" rx="6" fill="#1f1f1f"/>
  <rect x="40" y="100" width="4" height="52" rx="2" class="bad"/>
  <text class="label" x="60" y="121" fill="#ef9a9a">Tu Máquina (macOS)</text>
  <text class="sublabel" x="60" y="140">Python 3.9 · librerías del sistema</text>

  <rect x="40" y="162" width="320" height="52" rx="6" fill="#1f1f1f"/>
  <rect x="40" y="162" width="4" height="52" rx="2" class="bad"/>
  <text class="label" x="60" y="183" fill="#ef9a9a">Compañero (Windows)</text>
  <text class="sublabel" x="60" y="202">Python 3.11 · rutas distintas</text>

  <rect x="40" y="224" width="320" height="52" rx="6" fill="#1f1f1f"/>
  <rect x="40" y="224" width="4" height="52" rx="2" class="bad"/>
  <text class="label" x="60" y="245" fill="#ef9a9a">Servidor Producción (Ubuntu)</text>
  <text class="sublabel" x="60" y="264">Python 3.12 · versiones diferentes</text>

  <!-- Conflict badge -->
  <rect x="100" y="292" width="200" height="36" rx="18" fill="#b71c1c"/>
  <text x="200" y="316" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#ffffff">Conflictos de entorno</text>

  <text class="sublabel" x="200" y="356" text-anchor="middle" fill="#ef5350">"En mi máquina funciona" 🤷</text>
  <text class="sublabel" x="200" y="374" text-anchor="middle">Cada máquina = entorno diferente</text>

  <!-- === RIGHT PANEL: Docker === -->
  <rect x="420" y="60" width="360" height="340" rx="8" fill="#16213e"/>
  <text class="heading" x="600" y="88" text-anchor="middle" fill="#26a69a">✓ Con Docker</text>

  <!-- Shared container -->
  <rect x="440" y="100" width="320" height="170" rx="6" fill="#0f3460"/>
  <text font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#80cbc4" x="600" y="120" text-anchor="middle">Imagen Docker (compartida)</text>

  <!-- Layer 1 -->
  <rect x="460" y="128" width="280" height="32" rx="4" fill="#004d40"/>
  <text class="label" x="600" y="149" text-anchor="middle" fill="#80cbc4">Tu App + dependencias exactas</text>

  <!-- Layer 2 -->
  <rect x="460" y="166" width="280" height="32" rx="4" fill="#00695c"/>
  <text class="label" x="600" y="187" text-anchor="middle" fill="#b2dfdb">Python 3.14 (siempre)</text>

  <!-- Layer 3 -->
  <rect x="460" y="204" width="280" height="32" rx="4" fill="#00796b"/>
  <text class="label" x="600" y="225" text-anchor="middle" fill="#e0f2f1">Linux (base reproducible)</text>

  <!-- Runs on -->
  <text class="sublabel" x="600" y="286" text-anchor="middle" fill="#9e9e9e">Corre igual en cualquier máquina</text>

  <!-- Machines row -->
  <rect x="440" y="294" width="88" height="36" rx="6" fill="#1a237e"/>
  <text class="sublabel" x="484" y="317" text-anchor="middle" fill="#90caf9">macOS</text>

  <rect x="536" y="294" width="88" height="36" rx="6" fill="#1a237e"/>
  <text class="sublabel" x="580" y="317" text-anchor="middle" fill="#90caf9">Windows</text>

  <rect x="632" y="294" width="108" height="36" rx="6" fill="#1a237e"/>
  <text class="sublabel" x="686" y="317" text-anchor="middle" fill="#90caf9">Ubuntu Server</text>

  <!-- Success badge -->
  <rect x="490" y="344" width="220" height="36" rx="18" fill="#004d40"/>
  <text x="600" y="368" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#80cbc4">✓ Siempre reproducible</text>
</svg>
